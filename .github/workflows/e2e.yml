name: e2e

# The gap docs/testing/release-checklist.md warns about in a box — "CI does not
# run most of this" — closed for the part that can be made deterministic.
#
# Two jobs, split by cost:
#
#   gw     the Tier-B suite. A real mailgw-go-test process, a scriptable relay
#          and a fake logservice, all in one runner. No Docker, no database, no
#          network. ~1 minute. This is the one that should gate a merge.
#   stack  the Tier-A suite. The real image, the console, MariaDB, logservice
#          and MailHog. Slower and with more moving parts, so it runs on main
#          and on demand rather than on every push.

on:
    push:
        branches: [main]
        paths:
            - "mailgw-go/**"
            - "tests/**"
            - "webui-fastify/**"
            - "logservice-go/**"
            - "docker-compose*.yaml"
            - ".github/workflows/e2e.yml"
    pull_request:
        paths:
            - "mailgw-go/**"
            - "tests/**"
            - ".github/workflows/e2e.yml"
    workflow_dispatch:

jobs:
    gw:
        name: gateway (tier B, no docker)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version: "1.26"
                  cache-dependency-path: mailgw-go/go.sum

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Built once, here, rather than by the harness on first use: a
            # compile error should fail this step and read as a compile error,
            # not as a gateway that would not start mid-suite.
            - name: Build the engineering binary
              run: go build -trimpath -o "$RUNNER_TEMP/mailgw-go-test" ./cmd/mailgw-go-test
              working-directory: mailgw-go

            - name: Install test dependencies
              run: bun install --frozen-lockfile
              working-directory: tests

            - name: Typecheck
              run: bunx tsc --noEmit -p tsconfig.json
              working-directory: tests

            - name: Tier B
              env:
                  MAILGW_GO_TEST_BIN: ${{ runner.temp }}/mailgw-go-test
                  # A tier that can silently skip itself in CI is a tier that
                  # will one day be skipped entirely and nobody will notice.
                  MAILGW_REQUIRE_TIER_B: "1"
              run: bun test ./tests/gw/

    stack:
        name: stack (tier A, docker compose)
        runs-on: ubuntu-latest
        # Only where the extra minutes are worth it. A PR gets the gw job.
        if: github.event_name != 'pull_request'
        # Every wait in this job is bounded, but a runner held for six hours by
        # one that is not would be worse than a red build.
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build the engineering image
              run: bash mailgw-go/container-build-test.sh

            # Deliberately no `pnpm certs` step. The console serves HTTP/2 over
            # TLS and mints its own self-signed pair into the mounted
            # certs/generated/webui when that directory holds none
            # (webui-fastify/src/tls.ts ensureTlsPair, M22), so this exercises
            # the unattended path a real core node comes up on. Note certs/ is a
            # standalone Bun package outside the pnpm workspace, so the root
            # `pnpm install` above would not have installed its node-forge
            # anyway.
            - name: Bring the stack up
              run: |
                  MAILGW_GO_TEST_VERSION=$(cat mailgw-go/VERSION) \
                    docker compose -f docker-compose.yaml -f docker-compose.test.yaml up -d

            - name: Install test dependencies
              run: bun install --frozen-lockfile
              working-directory: tests

            # tests/stack/ready.ts is imported by five files across two
            # directories; nothing else in this job would catch a broken import.
            - name: Typecheck
              run: bunx tsc --noEmit -p tsconfig.json
              working-directory: tests

            # From a genuinely clean volume, which is the regression M19 fixed
            # and the reason the control API exists at all.
            #
            # This step BLOCKS until the gateway has applied a console-issued
            # configuration and is answering 220 — see tests/stack/ready.ts. It
            # used to return on a bare TCP connect to the published SMTP port,
            # which succeeds through docker-proxy whether or not anything is
            # bound behind it, so it reported success a millisecond after the
            # deploy and Tier A raced a gateway that was still pending.
            - name: Provision
              run: bun tests/provision.ts

            - name: Tier A
              env:
                  SMTP_PORT: "2525"
                  MAILGW_API_E2E: "1"
                  MAILGW_DB_CHECK: "1"
                  # A tier that can silently skip itself in CI is a tier that
                  # will one day be skipped entirely and nobody will notice —
                  # the same reasoning as MAILGW_REQUIRE_TIER_B above. Without
                  # it, a slow answer from the control API during Bun's import
                  # pass skips the whole configuration story and exits 0.
                  MAILGW_REQUIRE_TIER_A: "1"
              run: bun test ./tests/stack/ ./tests/smtp/ ./tests/api/

            # Asked of the gateway itself, before the logs: when Tier A fails it
            # is nearly always because the node is not in the state the suite
            # needs, and these two answers say which state it IS in.
            - name: Gateway state
              if: failure()
              run: |
                  curl -sS http://127.0.0.1:9090/testctl/status || true
                  echo
                  curl -sS -i http://127.0.0.1:8080/readyz || true

            # Without this a stack failure in CI is unreadable: the assertion
            # says "no message arrived" and the reason is in a container log
            # that no longer exists.
            - name: Compose logs
              if: failure()
              run: docker compose -f docker-compose.yaml -f docker-compose.test.yaml logs --no-color > compose-logs.txt

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: compose-logs
                  path: compose-logs.txt
