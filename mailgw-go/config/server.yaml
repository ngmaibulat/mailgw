# mailgw-go configuration for the compose stack.
#
# Replaces Haraka's connection.ini, smtp.ini, log.ini, me, smtpgreeting and
# host_list. Values mirror mailgw/config/connection.ini.

hostname: devbook.local
local_domains: [devbook.local, ngm.dev]

listen:
    # 2525, not 25: the container runs as a non-root user. Compose maps it.
    - addr: "0.0.0.0:2525"
      # implicit_tls: true wraps the socket in TLS from the first byte
      # (submissions, port 465) and needs tls.cert + tls.key below.
      #
      # proxy_protocol: true reads a PROXY header (v1 or v2) from every
      # connection, so the allowlist and the conn.* rules see the real client
      # instead of the L4 load balancer in front. It is fail-closed: no valid
      # header, or a peer outside proxy_trusted, and the connection is dropped
      # without a reply. A PROXY header is trivially forged, so proxy_trusted is
      # required and must be non-empty — it is the only thing between a forged
      # header and an open relay, and a listener with this set must NOT be
      # reachable directly. Note a v2 LOCAL command (what a balancer's own health
      # check usually sends) carries no client address, so that connection is
      # judged on the balancer's own address and needs to be in ngmfilter.json.
      #
      # proxy_protocol: true
      # proxy_trusted: ["10.0.0.0/8"]

# TLS for inbound sessions. Both paths empty disables it, which is the default.
# starttls defaults to TRUE, so it is an opt-out — but it is inert without a
# keypair, so saying nothing here changes nothing.
#
# cert and key are paths on this host, never material carried in a configuration
# bundle: the console keeps every version forever and serves it to every gateway
# on the profile. A managed node with neither generates a self-signed pair into
# its data directory. A certificate renewed in place is picked up without a
# restart, so an external certbot on the host works.
tls:
    cert: ""
    key: ""
    starttls: true
    # Offer AUTH on an unencrypted session. Defaults to FALSE, and without it a
    # client that tries anyway is answered 523 5.7.10 — so a submission password
    # is never invited onto a cleartext socket by accident. The legitimate case
    # is TLS terminated in front of this gateway, in which case set
    # proxy_protocol on the listener too, or the allowlist and the conn.* rules
    # see the balancer instead of the client.
    allow_insecure_auth: false

max:
    bytes: 26214400 # connection.ini [max] bytes
    line_length: 512 # connection.ini [max] line_length
    recipients: 100
    # The hop limit RFC 5321 §6.3 asks for; over it, the message is refused 554
    # 5.4.6. The count includes the Received header this gateway adds.
    received_headers: 100 # connection.ini [headers] max_received
    # Over it, the message is refused 552 5.3.4. Counts lines in the header
    # block only, not the body.
    header_lines: 1000 # connection.ini [headers] max_lines
    # Concurrent inbound sessions, across every listener above. Over it, a peer
    # is answered 421 4.7.0 and closed — "come back", not "give up". No Haraka
    # equivalent: go-smtp spawns a goroutine per connection with no cap of its
    # own, and each one costs a descriptor plus, once DATA starts, a spool temp
    # file. It is worth nothing without inactivity_timeout below: a cap over
    # sessions that never end is a denial-of-service primitive, not a defence.
    # It must be positive — raise it rather than writing 0 to lift the ceiling.
    connections: 1024

smtputf8: true # connection.ini [main] smtputf8
inactivity_timeout: 300s

# Bounds the WHOLE teardown — draining sessions, the delivery attempt in flight
# and the audit events behind it — not any one step. The container's
# stop_grace_period must exceed this or the ordering buys nothing: the runtime
# SIGKILLs part-way through. Both compose files set 30s.
shutdown_timeout: 10s

log:
    level: info
    format: json

outbound:
    concurrency: 10
    per_group_connections: 5
    # Ceiling on how long the scheduler sleeps, not a fixed tick: queued work
    # wakes it exactly when due and a new message wakes it at once. This only
    # bounds how long an envelope placed in q/ by hand goes unnoticed.
    poll_interval: 5s
    spool_dir: /opt/mailgw-go/queue
    backoff: [60s, 5m, 15m, 30m, 1h, 2h, 4h, 8h]
    max_lifetime: 96h
    delay_warning_after: 4h
    jitter: 0.15
    connect_timeout: 30s
    data_timeout: 10m

dsn:
    enabled: true
    return: headers
    postmaster: postmaster@devbook.local

attach:
    # Parity with the disabled #ngmFilterAttach entry in mailgw/config/plugins.
    enabled: false
    url: http://logservice:3000/filter/md5
    timeout: 3s
    fail: closed
    include_inline: true
    # reject | tempfail | quarantine | discard
    on_block: reject

# Message authentication: SPF, DKIM and DMARC in, DKIM signing out.
#
# Every switch here is off, and each one costs DNS per message (and, for DKIM
# verification, a second pass over the spooled body) — the same treatment
# attach.enabled and outbound.reuse_connections get. A rule that reads spf.*,
# dkim.* or dmarc.* turns the matching check on by itself, so these flags are
# for the case where you want the Authentication-Results header without writing
# a rule.
#
# Nothing here rejects anything. The results become rule fields; what to do
# about a DMARC failure is a rule you write.
msgauth:
    spf:
        enabled: false
    dkim:
        enabled: false
    dmarc:
        # Needs spf or dkim: it is alignment over their results.
        enabled: false
    # The name this gateway signs Authentication-Results with, and the name it
    # strips FORGED Authentication-Results under (RFC 7601 section 5). Empty
    # means `hostname` above.
    authserv_id: ""
    max_dkim_signatures: 10
    dns_timeout: 5s
    sign:
        enabled: false
        # `key` is a PATH ON THIS HOST. A private key never travels in a
        # configuration bundle — the console keeps every version for ever and
        # serves it to every gateway on the profile. Put the key in the data
        # directory (/opt/mailgw-go/data/dkim/ in the shipped deployment) and
        # name it from a server profile; nothing generates one for you, because
        # a key whose public half is not in DNS produces signatures that fail.
        #
        # The signing key is chosen by the message's From header domain, so d=
        # aligns and DMARC credits it downstream.
        keys: []
        #   - domain: ngm.dev
        #     selector: mail
        #     key: /var/lib/mailgw-go/dkim/ngm.dev.mail.key
        canonicalization: relaxed/relaxed
        # Empty is the RFC 6376 section 5.4.1 recommended set. Must include From.
        headers: []
        # 0 means the signature does not expire.
        expiration: 0

# Rate limits: how OFTEN something may happen, per key.
#
# The other half of the pair `max:` above starts. `max.connections` bounds how
# many connections exist AT ONCE; these bound how often things happen at all —
# a peer opening one connection at a time and pushing a million messages through
# it never trips a concurrency cap.
#
# Every limit is OFF (`rate: 0`). There is no default rate a mail gateway can
# pick without guessing at your traffic, and a default that started refusing
# mail on an upgrade would be the opposite of every other default here.
#
# Refusals are TEMPORARY — 421 at the connection, 450 in a transaction — so a
# legitimate sender retries and a limit set too low costs delay, never mail.
#
# The counters are in memory and PER GATEWAY: ten edge nodes with a limit of
# 100/min admit 1000/min between them. A shared counter would put a network
# round trip in the accept path and turn a management-plane outage into a mail
# outage.
#
# These are read live. Changing them does NOT need a restart.
ratelimit:
    # Connections accepted from one IP. Answers 421.
    connect_per_ip:
        rate: 0
        per: 1m
        burst: 0 # 0 means a full window's worth
    # Messages from one envelope sender. Answers 450.
    messages_per_sender:
        rate: 0
        per: 1h
    # Messages from one authenticated user (needs `auth.json`). Answers 450.
    messages_per_user:
        rate: 0
        per: 1h
    # Recipients accepted for one destination domain. Answers 450 for that
    # recipient only; the others in the same transaction continue.
    rcpts_per_domain:
        rate: 0
        per: 1m
    # Failed AUTH attempts from one IP. Checked BEFORE the password comparison,
    # so a refusal costs no bcrypt. Answers 454.
    auth_failures_per_ip:
        rate: 0
        per: 10m
    # Ceiling on how many keys are tracked across every limit above. 0 is the
    # built-in bound, not "unlimited" — a limiter keyed on remote IP is itself a
    # memory-exhaustion vector if nothing evicts.
    max_keys: 0

events:
    timeout: 3s
    retries: 3
    buffer_size: 4096
    senders: 4
    api_key_env: API_KEY
    # How often failed-events/ is resent. 0 disables the background pass;
    # `mailgw-go events replay` still works.
    replay_interval: 5m
    # How long failed-events/rejected/ keeps an event a replay gave up on. Those
    # files are the evidence of what logservice refused, so they are kept on
    # purpose — but nothing else drains that directory. 0 never deletes. The
    # sweep rides the replay pass, so replay_interval: 0 disables this too, and
    # the gateway warns at boot when it would.
    rejected_retention: 720h
